services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: chat01
      POSTGRES_PASSWORD: chat01senha
      POSTGRES_DB: chat01
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build: ./backend
    restart: always
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
